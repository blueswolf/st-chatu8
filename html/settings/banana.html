<div id="zinao-chatu-tab-banana" class="zinao-chatu-settings-banana">
    <!-- 1. 基础设置 -->
    <div class="zinao-chatu-settings-section">
        <h3>基础设置</h3>
        <div class="zinao-chatu-field-col">
            <label for="zinao-chatu-banana-api-url">API 连接地址</label>
            <input type="text" id="zinao-chatu-banana-api-url" class="zinao-chatu-text-input" placeholder="http://localhost:7860">
        </div>
        <div class="zinao-chatu-field-col">
            <label for="zinao-chatu-banana-api-key">API Key</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="zinao-chatu-banana-api-key" class="zinao-chatu-text-input" placeholder="在此输入您的 API Key" style="padding-right: 2.2em;">
                <button type="button" id="zinao-chatu-banana-api-key-toggle" title="显示/隐藏 API Key" style="position: absolute; right: 0.4em; background: none; border: none; cursor: pointer; color: inherit; opacity: 0.6; padding: 0; font-size: 1em; line-height: 1;">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <div class="zinao-chatu-field">
            <label for="zinao-chatu-banana-model-select">图像模型</label>
            <div class="zinao-chatu-profile-controls">
                <select id="zinao-chatu-banana-model-select" class="zinao-chatu-select"></select>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-fetch-models" title="获取模型列表（同时填充图像/修图/视频三个下拉框）"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>
        <div class="zinao-chatu-grid-2">
            <div class="zinao-chatu-field">
                <label for="zinao-chatu-banana-edit-model-select">修图模型</label>
                <div class="zinao-chatu-profile-controls">
                    <select id="zinao-chatu-banana-edit-model-select" class="zinao-chatu-select"></select>
                </div>
            </div>
            <div class="zinao-chatu-field">
                <label for="zinao-chatu-banana-video-model-select">视频模型</label>
                <div class="zinao-chatu-profile-controls">
                    <select id="zinao-chatu-banana-video-model-select" class="zinao-chatu-select"></select>
                </div>
            </div>
        </div>
        <div class="zinao-chatu-field">
            <label for="zinao-chatu-banana-aspect-ratio">长宽比</label>
            <select id="zinao-chatu-banana-aspect-ratio" class="zinao-chatu-select">
                <option value="1:1">1:1</option>
                <option value="9:16">9:16</option>
                <option value="16:9">16:9</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="zinao-chatu-banana-use-grok-format">Grok 原生格式</label>
            <label class="zinao-chatu-toggle" for="zinao-chatu-banana-use-grok-format" title="开启后使用 Grok 的 /v1/images/generations 端点。仅发送 { model, prompt, n, response_format }，将忽略对话预设/参考图，且不支持修图与视频模式。">
                <input id="zinao-chatu-banana-use-grok-format" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </label>
        </div>
        <div class="zinao-chatu-banana-replace-help">
            <details>
                <summary><i class="fa-solid fa-circle-info"></i> Grok 原生格式说明</summary>
                <div class="zinao-chatu-help-content">
                    <ul>
                        <li>适用于 <code>grok-imagine-*</code> 等通过 <code>/v1/images/generations</code> 端点生图的模型。</li>
                        <li>开启后将<strong>忽略对话预设与参考图</strong>，仅发送 <code>{ model, prompt, n, response_format }</code>。</li>
                        <li><strong>不支持修图与视频模式</strong>（这两类仍走多模态 chat/completions 路径）。</li>
                        <li>Grok 当前固定输出分辨率，<strong>长宽比设置对它无效</strong>。</li>
                    </ul>
                </div>
            </details>
        </div>
        <div class="zinao-chatu-grid-2">
            <div class="zinao-chatu-field">
                <label for="zinao-chatu-banana-edit-preset">修图预设选择</label>
                <select id="zinao-chatu-banana-edit-preset" class="zinao-chatu-select"></select>
            </div>
            <div class="zinao-chatu-field">
                <label for="zinao-chatu-banana-video-preset">视频预设选择</label>
                <select id="zinao-chatu-banana-video-preset" class="zinao-chatu-select"></select>
            </div>
        </div>
    </div>

    <!-- 2. 多轮对话 -->
    <div id="zinao-chatu-banana-multimodal-section" class="zinao-chatu-settings-section">
        <h3>多轮对话 (Gemini)</h3>
        <div class="zinao-chatu-field-col">
            <label for="zinao-chatu-banana-fixed-prompt">固定正面提示词</label>
            <textarea id="zinao-chatu-banana-fixed-prompt" class="zinao-chatu-textarea" rows="2"></textarea>
        </div>
        <div class="zinao-chatu-field-col">
            <label for="zinao-chatu-banana-postfix-prompt">后置固定正面提示词</label>
            <textarea id="zinao-chatu-banana-postfix-prompt" class="zinao-chatu-textarea" rows="2"></textarea>
        </div>
        <div class="zinao-chatu-field">
            <label for="zinao-chatu-banana-conversation-preset-id">对话预设</label>
            <div class="zinao-chatu-profile-controls">
                <select id="zinao-chatu-banana-conversation-preset-id" class="zinao-chatu-select"></select>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-new" title="新建"><i class="fa-solid fa-plus"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-rename" title="重命名"><i class="fa-solid fa-pen"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-save" title="保存"><i class="fa-solid fa-save"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-save-as" title="另存为"><i class="fa-solid fa-file-export"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-import" title="导入"><i class="fa-solid fa-download"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao-chatu-banana-conversation-export" title="导出"><i class="fa-solid fa-upload"></i></button>
                <button class="zinao-chatu-icon-btn danger" id="zinao-chatu-banana-conversation-delete" title="删除"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        
        <div class="zinao-chatu-banana-conversation-group">
            <h4>第 1 轮</h4>
            <div class="zinao-chatu-banana-conversation-turn">
                <div class="zinao-chatu-banana-turn-user">
                    <h5>User</h5>
                    <textarea id="zinao-chatu-banana-user-text-1" class="zinao-chatu-textarea" rows="3" placeholder="用户文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-user-image-container-1">
                        <img id="zinao-chatu-banana-user-image-1" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-user-image-remove-1" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-user-image-input-1" accept="image/*" style="display:none;">
                    </div>
                </div>
                <div class="zinao-chatu-banana-turn-model">
                    <h5>Model</h5>
                    <textarea id="zinao-chatu-banana-model-text-1" class="zinao-chatu-textarea" rows="3" placeholder="模型文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-model-image-container-1">
                        <img id="zinao-chatu-banana-model-image-1" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-model-image-remove-1" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-model-image-input-1" accept="image/*" style="display:none;">
                    </div>
                </div>
            </div>
        </div>
        <div class="zinao-chatu-banana-conversation-group">
            <h4>第 2 轮</h4>
            <div class="zinao-chatu-banana-conversation-turn">
                <div class="zinao-chatu-banana-turn-user">
                    <h5>User</h5>
                    <textarea id="zinao-chatu-banana-user-text-2" class="zinao-chatu-textarea" rows="3" placeholder="用户文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-user-image-container-2">
                        <img id="zinao-chatu-banana-user-image-2" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-user-image-remove-2" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-user-image-input-2" accept="image/*" style="display:none;">
                    </div>
                </div>
                <div class="zinao-chatu-banana-turn-model">
                    <h5>Model</h5>
                    <textarea id="zinao-chatu-banana-model-text-2" class="zinao-chatu-textarea" rows="3" placeholder="模型文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-model-image-container-2">
                        <img id="zinao-chatu-banana-model-image-2" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-model-image-remove-2" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-model-image-input-2" accept="image/*" style="display:none;">
                    </div>
                </div>
            </div>
        </div>
        <div class="zinao-chatu-banana-conversation-group">
            <h4>第 3 轮</h4>
            <div class="zinao-chatu-banana-conversation-turn">
                <div class="zinao-chatu-banana-turn-user">
                    <h5>User</h5>
                    <textarea id="zinao-chatu-banana-user-text-3" class="zinao-chatu-textarea" rows="3" placeholder="用户文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-user-image-container-3">
                        <img id="zinao-chatu-banana-user-image-3" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-user-image-remove-3" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-user-image-input-3" accept="image/*" style="display:none;">
                    </div>
                </div>
                <div class="zinao-chatu-banana-turn-model">
                    <h5>Model</h5>
                    <textarea id="zinao-chatu-banana-model-text-3" class="zinao-chatu-textarea" rows="3" placeholder="模型文本..."></textarea>
                    <div class="zinao-chatu-image-preview-container small" id="zinao-chatu-banana-model-image-container-3">
                        <img id="zinao-chatu-banana-model-image-3" src="" style="display:none;">
                        <div class="zinao-chatu-image-placeholder"><i class="fa-solid fa-image"></i></div>
                        <button class="zinao-chatu-icon-btn danger top-right" id="zinao-chatu-banana-model-image-remove-3" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
                        <input type="file" id="zinao-chatu-banana-model-image-input-3" accept="image/*" style="display:none;">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

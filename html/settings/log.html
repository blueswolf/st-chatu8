<div id="ch-tab-log">
    <!-- 普通日志 -->
    <div class="zinao-chatu-settings-section">
        <h3>📋 日志</h3>
        <div class="zinao-chatu-field">
            <label>操作</label>
            <div>
                <button id="ch-export-log" class="zinao-chatu-btn">导出日志</button>
                <button id="ch-clear-log" class="zinao-chatu-btn danger">清空日志</button>
            </div>
        </div>
        <div class="zinao-chatu-field-col">
            <label for="ch-log-textarea">日志输出</label>
            <textarea id="ch-log-textarea" class="zinao-chatu-textarea" rows="15" readonly style="font-family: monospace; font-size: 12px;"></textarea>
        </div>
    </div>
</div>

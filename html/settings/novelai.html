<div id="ch-tab-novelai">
    <div class="ch-prompts-section zinao-chatu-settings-section">
        <h3>固定提示词</h3>
        <div class="zinao-chatu-field">
            <label for="yusheid_novelai">提示词预设</label>
            <div class="zinao-chatu-profile-controls">
                <select id="yusheid_novelai" class="zinao-chatu-select"></select>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_visual_select_novelai" title="可视化选择"><i class="fa-solid fa-grip"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_new_novelai" title="新建"><i class="fa-solid fa-plus"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_update_style_novelai" title="保存"><i class="fa-solid fa-save"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_save_style_novelai" title="另存为"><i class="fa-solid fa-file-export"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_rename_novelai" title="重命名"><i class="fa-solid fa-pen"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_export_current_novelai" title="导出当前"><i class="fa-solid fa-upload"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_export_all_novelai" title="导出全部"><i class="fa-solid fa-file-export"></i></button>
                <button class="zinao-chatu-icon-btn" id="zinao_chatu_tishici_import_novelai" title="导入"><i class="fa-solid fa-download"></i></button>
                <button class="zinao-chatu-icon-btn danger" id="zinao_chatu_tishici_delete_style_novelai" title="删除"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="zinao-chatu-field-col">
            <label for="fixedPrompt_novelai">固定正面提示词 <span class="zinao-chatu-unsaved-warning" title="设置尚未保存" style="display: none;"><i class="fa-solid fa-triangle-exclamation"></i></span></label>
            <button class="zinao-chatu-icon-btn" id="translate_fixedPrompt_novelai" title="翻译" style="align-self: flex-end; margin: 4px 0;"><i class="fa-solid fa-language"></i></button>
            <textarea id="fixedPrompt_novelai" class="zinao-chatu-textarea" rows="4"></textarea>
            <div id="novelai_fixedPrompt_tokens" class="zinao-chatu-token-display">当前占用: 0 | 总占用: 0 / 512</div>
            <div id="fixedPrompt_novelai-results" class="ch-autocomplete-results"></div>
        </div>
        <div class="zinao-chatu-field-col">
            <label for="fixedPrompt_end_novelai">后置固定正面提示词 <span class="zinao-chatu-unsaved-warning" title="设置尚未保存" style="display: none;"><i class="fa-solid fa-triangle-exclamation"></i></span></label>
            <button class="zinao-chatu-icon-btn" id="translate_fixedPrompt_end_novelai" title="翻译" style="align-self: flex-end; margin: 4px 0;"><i class="fa-solid fa-language"></i></button>
            <textarea id="fixedPrompt_end_novelai" class="zinao-chatu-textarea" rows="4"></textarea>
            <div id="novelai_fixedPrompt_end_tokens" class="zinao-chatu-token-display">当前占用: 0 | 总占用: 0 / 512</div>
            <div id="fixedPrompt_end_novelai-results" class="ch-autocomplete-results"></div>
        </div>
        <div class="zinao-chatu-field-col">
            <label for="negativePrompt_novelai">固定负面提示词 <span class="zinao-chatu-unsaved-warning" title="设置尚未保存" style="display: none;"><i class="fa-solid fa-triangle-exclamation"></i></span></label>
            <textarea id="negativePrompt_novelai" class="zinao-chatu-textarea" rows="4"></textarea>
            <div id="novelai_negativePrompt_tokens" class="zinao-chatu-token-display">当前占用: 0 / 512</div>
            <div id="negativePrompt_novelai-results" class="ch-autocomplete-results"></div>
        </div>

    </div>

    <div class="zinao-chatu-settings-section">
        <h3>质量预设</h3>
        <div class="zinao-chatu-field">
            <label for="addFurryDataset">添加福瑞数据集</label>
            <select id="addFurryDataset" class="zinao-chatu-select">
                <option value="true">启用</option>
                <option value="false" selected="">禁用</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="AQT_novelai">正面质量预设</label>
            <select id="AQT_novelai" class="zinao-chatu-select">
                <option value="best quality, amazing quality, very aesthetic, absurdres">启用</option>
                <option value="">禁用</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="UCP_novelai">负面质量预设</label>
            <select id="UCP_novelai" class="zinao-chatu-select">
            </select>
        </div>
    </div>
    <div class="zinao-chatu-settings-section">
        <h3>配置档案</h3>
        <div class="zinao-chatu-field">
            <label for="novelai_profile_id">当前配置</label>
            <div class="zinao-chatu-profile-controls">
                <select id="novelai_profile_id" class="zinao-chatu-select"></select>
                <button class="zinao-chatu-icon-btn" id="novelai_profile_load" title="读取">
                    <i class="fa-solid fa-folder-open"></i>
                </button>
                <button class="zinao-chatu-icon-btn" id="novelai_profile_new" title="新建">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="zinao-chatu-icon-btn" id="novelai_profile_save" title="保存当前">
                    <i class="fa-solid fa-save"></i>
                </button>
                <button class="zinao-chatu-icon-btn danger" id="novelai_profile_delete" title="删除">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="zinao-chatu-settings-section">
        <h3>NovelAI 设置</h3>
        <div class="zinao-chatu-field-col">
            <label for="novelaiApi">NovelAI API</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="novelaiApi" class="zinao-chatu-text-input" style="padding-right: 2.2em;">
                <button type="button" id="novelaiApiToggle" title="显示/隐藏 API Key" style="position: absolute; right: 0.4em; background: none; border: none; cursor: pointer; color: inherit; opacity: 0.6; padding: 0; font-size: 1em; line-height: 1;">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <div class="zinao-chatu-field">
            <label for="novelaisite">站点</label>
            <select id="novelaisite" class="zinao-chatu-select">
                <option>官网</option>
                <option>其他站点</option>
            </select>
        </div>
        <div class="zinao-chatu-field" id="novelai-other-site-field">
            <label for="novelaiOtherSite">其他novelai站点</label>
            <input type="text" id="novelaiOtherSite" class="zinao-chatu-text-input">
        </div>
        <div class="zinao-chatu-field">
            <label for="enableCloudQueue">启用云端队列</label>
            <div class="zinao-chatu-toggle">
                <input id="enableCloudQueue" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field" id="cloud-queue-url-field">
            <label for="cloudQueueUrl">队列服务地址</label>
            <input type="text" id="cloudQueueUrl" class="zinao-chatu-text-input" placeholder="https://xxx.hf.space">
        </div>
        <div class="zinao-chatu-field" id="cloud-queue-greeting-field">
            <label for="cloudQueueGreeting">排队个性语 (15字)</label>
            <input type="text" id="cloudQueueGreeting" class="zinao-chatu-text-input" placeholder="正在生成中~" maxlength="15">
        </div>
        <div class="zinao-chatu-field">
            <label for="showQueueGreeting">显示他人个性语</label>
            <div class="zinao-chatu-toggle">
                <input id="showQueueGreeting" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field">
            <label for="novelaimode">模型</label>
            <select id="novelaimode" class="zinao-chatu-select">
                <option>nai-diffusion-3</option>
                <option>nai-diffusion-4-full</option>
                <option>nai-diffusion-4-curated-preview</option>
                <option>nai-diffusion-4-5-curated</option>
                <option>nai-diffusion-4-5-full</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="novelai_sampler">采样方法</label>
            <select id="novelai_sampler" class="zinao-chatu-select">
                <option value="k_euler">Euler</option>
                <option value="ddim_v3">DDIM</option>
                <option value="k_dpmpp_2s_ancestral"> DPM++ 2S Ancestral</option>
                <option value="k_dpmpp_2m">DPM++ 2M</option>
                <option value="k_euler_ancestral"> Euler Ancestral</option>
                <option value="k_dpmpp_2m_sde">DPM++ 2M SDE</option>
                <option value="k_dpmpp_sde">DPM++ SDE</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="Schedule">噪点表</label>
            <select id="Schedule" class="zinao-chatu-select">
                <option>native</option>
                <option>exponential</option>
                <option>polyexponential</option>
                <option>karras</option>
            </select>
        </div>
        <div class="zinao-chatu-field">
            <label for="nai3Scale">Prompt Guidance</label>
            <input type="number" id="nai3Scale" class="zinao-chatu-text-input">
        </div>
        <div class="zinao-chatu-field">
            <label for="cfg_rescale">Prompt Guidance Rescale</label>
            <input type="number" id="cfg_rescale" class="zinao-chatu-text-input">
        </div>
        <div class="zinao-chatu-field">
            <label for="AI_use_coords">AI 默认角色位置</label>
            <div class="zinao-chatu-toggle">
                <input id="AI_use_coords" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field" id="zinao-chatu-nai3-sm-field">
            <label for="sm">SMEA</label>
            <div class="zinao-chatu-toggle">
                <input id="sm" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field" id="zinao-chatu-nai3-dyn-field">
            <label for="dyn">SMEA DYN</label>
            <div class="zinao-chatu-toggle">
                <input id="dyn" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field">
            <label for="nai3Variety">多样性 (Variety)</label>
            <div class="zinao-chatu-toggle">
                <input id="nai3Variety" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
        <div class="zinao-chatu-field" id="zinao-chatu-nai3-deceisp-field">
            <label for="nai3Deceisp">减少伪影 (Decrisp)</label>
            <div class="zinao-chatu-toggle">
                <input id="nai3Deceisp" type="checkbox"/>
                <span class="zinao-chatu-slider"></span>
            </div>
        </div>
    </div>
    <div class="zinao-chatu-settings-section">
        <h4>生成参数</h4>
        <div class="zinao-chatu-grid">
            <div class="zinao-chatu-field">
                <label for="novelai_size">预设尺寸</label>
                <select id="novelai_size" class="zinao-chatu-select">
                    <option value="512x512">512x512 (1:1, 图标)</option>
                    <option value="640x640">640x640 (1:1, 图标)</option>
                    <option value="512x768">512x768 (2:3, 垂直)</option>
                    <option value="768x512">768x512 (3:2, 水平)</option>
                    <option value="1024x1024">1024x1024 (1:1, SDXL)</option>
                    <option value="1216x832">1216x832 (19:13, 超高清)</option>
                    <option value="832x1216">832x1216 (13:19, 超高清)</option>
                </select>
            </div>
            <div class="zinao-chatu-field">
                <label for="novelai_width">宽度 (width)</label>
                <input type="number" id="novelai_width" class="zinao-chatu-text-input">
            </div>
            <div class="zinao-chatu-field">
                <label for="novelai_height">高度 (height)</label>
                <input type="number" id="novelai_height" class="zinao-chatu-text-input">
            </div>
            <div class="zinao-chatu-field">
                <label for="novelai_steps">生成步数 (steps)</label>
                <input type="number" id="novelai_steps" class="zinao-chatu-text-input">
            </div>
            <div class="zinao-chatu-field">
                <label for="novelai_seed">种子 (seed)</label>
                <input type="number" id="novelai_seed" class="zinao-chatu-text-input">
            </div>
        </div>
    </div>
</div>

<div class="zinao-chatu-settings-section">
    <div class="zinao-chatu-flex-container">
        <!-- 左侧：世界书 -->
        <div class="zinao-chatu-worldbook-container">
            <div class="zinao-chatu-list-header">
                <h3>📚 世界书</h3>
                <div class="zinao-chatu-field">
                    <input type="text" id="ch-send-data-world-search" class="zinao-chatu-text-input" placeholder="搜索...">
                </div>
                <div class="zinao-chatu-batch-buttons" style="display: flex; gap: 8px; margin-top: 8px;">
                    <button id="ch-send-data-refresh-worlds" class="zinao-chatu-batch-button" style="flex: 1;">
                        <i class="fa fa-refresh"></i> 刷新世界书
                    </button>
                    <button id="ch-send-data-test-trigger" class="zinao-chatu-batch-button" style="flex: 1; background: rgba(76, 175, 80, 0.2); border-color: rgba(76, 175, 80, 0.4);">
                        <i class="fa fa-flask"></i> 测试触发
                    </button>
                </div>
            </div>
            <div id="ch-send-data-world-list" class="zinao-chatu-scroll-list">
                <!-- JS 会填充这里 -->
            </div>
        </div>

        <!-- 右侧：条目 -->
        <div class="zinao-chatu-entry-container">
            <div class="zinao-chatu-list-header">
                <h3>📝 条目开关</h3>
                <div class="zinao-chatu-field">
                    <input type="text" id="ch-send-data-entry-search" class="zinao-chatu-text-input" placeholder="搜索...">
                </div>
                <div class="zinao-chatu-batch-buttons" style="display: flex; gap: 8px; margin-top: 8px;">
                    <button id="ch-send-data-select-all" class="zinao-chatu-batch-button" style="flex: 1;">全选</button>
                    <button id="ch-send-data-deselect-all" class="zinao-chatu-batch-button" style="flex: 1;">取消全选</button>
                </div>
                <div id="ch-send-data-new-entry-buttons" class="zinao-chatu-new-entry-buttons" style="display: none; gap: 8px; margin-top: 8px;">
                    <button id="ch-send-data-enable-new-entries" class="zinao-chatu-new-entry-btn" style="flex: 1;">启用所有新条目</button>
                    <button id="ch-send-data-disable-new-entries" class="zinao-chatu-new-entry-btn" style="flex: 1;">禁用所有新条目</button>
                </div>
            </div>
            <div id="ch-send-data-entry-list" class="zinao-chatu-scroll-list">
                <!-- JS 会填充这里 -->
            </div>
        </div>
    </div>
</div>
